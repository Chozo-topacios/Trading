# Copia este archivo a config.toml (ignorado por git) y ajústalo.

[general]
# paper           -> DEMO: bróker simulado local (recomendado para empezar)
# schwab_dry_run  -> lee cuenta/posiciones reales de Schwab, construye las órdenes y NO las envía
# schwab_live     -> órdenes REALES en Schwab ("live" es un alias)
# ibkr_paper      -> DEMO real: cuenta paper de Interactive Brokers (TWS / IB Gateway)
# ibkr_live       -> órdenes REALES en IBKR
# mt5_demo        -> DEMO real: cuenta demo de MetaTrader 5 (Exness u otro bróker MT5)
# mt5_live        -> órdenes REALES en MT5
# Los modos *_live requieren live_trading_enabled = true en su sección Y --confirm-live.
mode = "paper"
# Fuente de velas diarias: "csv" (data/<SYM>_D1.csv), "yfinance", "schwab",
# "ibkr" o "mt5" (estas dos leen del bróker conectado; solo con modos ibkr_* / mt5_*)
data_source = "csv"
data_dir = "data"
state_dir = "state"
initial_capital = 100000   # capital de la cuenta demo
cost_bps = 5               # comisión+slippage por lado (como el research TIS)

[risk]
mode = "risk"          # "risk" (1 % vs stop virtual ATR) o "fraction" (% del capital)
risk_pct = 0.01
atr_period = 14
atr_mult = 2.0
fraction = 1.0
max_position_pct = 0.5 # máximo 50 % del capital por posición
use_stop = false       # las reglas TIS no usan stop de precio

[[portfolio]]
symbol = "QQQ"
strategy = "tis_rsi2"
# params = { rsi_entry = 15, sma_period = 200, green_bars = 2 }

[[portfolio]]
symbol = "SPY"
strategy = "connors_rsi2"

# [[portfolio]]
# symbol = "IWM"
# strategy = "double7"

[schwab]
# Las credenciales van en variables de entorno: SCHWAB_APP_KEY, SCHWAB_APP_SECRET, SCHWAB_CALLBACK_URL
account_number = ""            # vacío = primera cuenta vinculada
token_path = "tokens/schwab_token.json"
live_trading_enabled = false   # protección: déjalo en false hasta validar en demo

[ibkr]
host = "127.0.0.1"
port = 7497                    # TWS paper 7497 | TWS real 7496 | Gateway paper 4002 | Gateway real 4001
client_id = 17
account = ""                   # vacío = primera cuenta de la sesión (paper empieza por "DU")
order_type = "MOO"             # MOO = Market-on-Open (apertura) | MKT = a mercado DAY
live_trading_enabled = false

[mt5]
# Credenciales en variables de entorno: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER (p. ej. "Exness-MT5Trial")
# Los símbolos de [[portfolio]] deben ser los del bróker: p. ej. "USTEC" (o "USTECm") en Exness.
terminal_path = ""             # vacío = terminal por defecto
magic = 20250202               # identifica las posiciones abiertas por este bot
deviation = 20                 # slippage máximo en puntos
live_trading_enabled = false
